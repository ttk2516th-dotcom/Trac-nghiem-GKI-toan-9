<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Toán 9 - Giữa Kỳ I (Vượt Ải)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mjx-chtml { margin: 0 !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Screen 1: Login -->
    <div id="login-screen" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Trắc Nghiệm Toán 9</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Họ và Tên</label>
                <input type="text" id="student-name" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nguyễn Văn A">
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">Lớp</label>
                <input type="text" id="student-class" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="9A1">
            </div>
            <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">Bắt đầu làm bài</button>
        </div>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="quiz-screen" class="hidden bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-2xl">
        <div class="flex justify-between items-center border-b pb-4 mb-4">
            <div>
                <p id="student-info-display" class="font-bold text-gray-800"></p>
                <p id="question-progress" class="text-sm text-gray-500">Câu 1/12</p>
            </div>
            <div class="text-right">
                <div class="text-2xl font-bold text-blue-600" id="timer">30s</div>
                <p class="text-xs text-gray-500">Thời gian còn lại</p>
            </div>
        </div>

        <div class="mb-4 flex flex-wrap justify-end gap-2">
            <button id="btn-next" onclick="nextQuestion()" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">Câu mới</button>
            <button id="btn-restart-round" onclick="restartRoundNow()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">Bắt đầu lại vòng mới</button>
        </div>

        <div class="min-h-[250px]">
            <h2 id="question-text" class="text-lg font-medium text-gray-800 mb-4 leading-relaxed"></h2>
            <div id="options-container" class="space-y-3"></div>
        </div>

        <div id="feedback-container" class="hidden mt-6 p-4 rounded-lg bg-red-50 border border-red-200">
            <h3 class="font-bold text-red-600 mb-2" id="feedback-title">Sai rồi!</h3>
            <p id="feedback-explanation" class="text-gray-700 text-sm"></p>
        </div>


    </div>

    <!-- Screen 3: Results -->
    <div id="result-screen" class="hidden bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2" id="result-title">Kết Quả</h1>
        <h2 id="result-student" class="text-lg text-blue-600 font-semibold mb-2"></h2>
        <p id="result-message" class="text-sm text-red-600 font-medium mb-6"></p>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-green-100 p-4 rounded-lg">
                <p class="text-sm text-green-700 font-semibold">Đúng</p>
                <p id="result-correct" class="text-2xl font-bold text-green-800">0</p>
            </div>
            <div class="bg-red-100 p-4 rounded-lg">
                <p class="text-sm text-red-700 font-semibold">Sai</p>
                <p id="result-wrong" class="text-2xl font-bold text-red-800">0</p>
            </div>
        </div>
        
        <div id="result-stats" class="hidden bg-gray-100 p-4 rounded-lg mb-6 text-left space-y-2">
            <p class="text-sm text-gray-600"><strong>Số vòng đã thử:</strong> <span id="result-retries"></span></p>
            <p class="text-sm text-gray-600"><strong>Thời gian bắt đầu làm bài:</strong> <span id="result-start"></span></p>
            <p class="text-sm text-gray-600"><strong>Thời gian kết thúc làm bài:</strong> <span id="result-finish"></span></p>
            <p class="text-sm text-gray-600 hidden" id="result-end-container"><strong>Thời lượng vòng đạt 12/12:</strong> <span id="result-end"></span></p>
        </div>

        <button id="btn-action" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200"></button>
    </div>

    <script>
        // Link Google Apps Script đã được cập nhật
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVjnqH97ZMQf9YLyI0rZAZayI7elddwhln09oKbyBAg_QHLos7bIKk2iD2XZebezww7Q/exec";

        const questionsData = [
            {
                id: 1,
                q: "Câu hỏi. Nghiệm của phương trình \\((2x-4)(3-9x)=0\\) là?",
                options: ["A. \\(x=2\\) và \\(x=3\\)", "B. \\(x=3\\) và \\(x=\\frac{1}{2}\\)", "C. \\(x=2\\) và \\(x=\\frac{1}{3}\\)", "D. \\(x=\\frac{1}{2}\\) và \\(x=\\frac{1}{3}\\)"],
                correct: 2,
                explanation: "Nhập \\(2x-4\\) -> bấm Shift -> bấm CALC -> bấm \\(0\\) -> bấm \\(=\\). <br>Tương tự với \\(3-9x\\). <br>Đáp án C."
            },
            {
                id: 2,
                q: "Câu hỏi. Phương trình \\(\\frac{1}{x+1}-\\frac{x}{x^2-x+1}=\\frac{3x}{x^3+1}\\) có điều kiện xác định là?",
                options: ["A. \\(x \\neq 1\\)", "B. \\(x \\neq -1\\)", "C. \\(x \\neq 1\\) và \\(x \\neq -1\\)", "D. \\(x \\neq 1\\) hoặc \\(x \\neq -1\\)"],
                correct: 1,
                explanation: "Mẫu số \\(x^3+1 = (x+1)(x^2-x+1)\\). Do \\(x^2-x+1 = (x-\\frac{1}{2})^2 + \\frac{3}{4} > 0\\) với mọi \\(x\\), nên ĐKXĐ chỉ cần \\(x+1 \\neq 0\\). <br>Nhập \\(x+1\\) -> bấm Shift -> bấm CALC -> bấm \\(0\\) -> bấm \\(=\\). <br>Đáp án B."
            },
            {
                id: 3,
                q: "Câu hỏi. Nghiệm của phương trình \\(\\frac{x+3}{x}=\\frac{x+9}{x-3}\\) là?",
                options: ["A. \\(x=-1\\)", "B. \\(x=0\\)", "C. \\(x=1\\)", "D. \\(x=3\\)"],
                correct: 0,
                explanation: "Nhập \\(\\frac{x+3}{x}=\\frac{x+9}{x-3}\\) vào MTCT -> bấm Shift -> bấm CALC -> bấm \\(0\\) -> bấm \\(=\\). <br>Trường hợp không ra kết quả thì bấm mũi tên qua trái/phải rồi làm tương tự nhưng lần này ta nhập lại \\(1\\) rồi mới bấm \\(=\\). <br>Đáp án A."
            },
            {
                id: 4,
                q: "Câu hỏi. Phương trình nào sau đây không là phương trình bậc nhất hai ẩn?",
                options: ["A. \\(2x+3y=5\\)", "B. \\(2x+0y=5\\)", "C. \\(0x+0y=5\\)", "D. \\(0x+3y=5\\)"],
                correct: 2,
                explanation: "Phương trình bậc nhất hai ẩn có dạng \\(ax+by=c\\) trong đó \\(a\\) và \\(b\\) không đồng thời bằng 0. <br>Ngoài ra nếu ẩn nằm dưới dâu căn/ dưới mẫu/ mũ cao thì đều không phải là phương trình bậc nhất hai ẩn. <br>Đáp án C."
            },
            {
                id: 5,
                q: "Câu hỏi. Nghiệm của hệ phương trình \\(\\begin{cases} \\frac{x}{2}-2y=-5 \\\\ 3x+\\frac{2y}{3}=8 \\end{cases}\\) là?",
                options: ["A. \\((x;y)=(-2;-3)\\)", "B. \\((x;y)=(-3;-2)\\)", "C. \\((x;y)=(2;3)\\)", "D. \\((x;y)=(3;2)\\)"],
                correct: 2,
                explanation: "MTCT đời cũ thì bấm: MODE -> 5 -> 1. <br>MTCT đời mới thì bấm: MENU -> 9 -> 1 -> 2. <br>Đáp án C."
            },
            {
                id: 6,
                q: "Câu hỏi. Hệ thức nào sau đây là bất đẳng thức?",
                options: ["A. \\(2a+7b=9\\)", "B. \\(2+7=9\\)", "C. \\(2a+7=9\\)", "D. \\(2a+7 \\ge 9\\)"],
                correct: 3,
                explanation: "Bất đẳng thức là hệ thức có chứa các dấu \\(>, <, \\ge, \\le\\). <br>Đáp án D."
            },
            {
                id: 7,
                q: "Câu hỏi. Bất phương trình nào sau đây có nghiệm là \\(x>5\\)?",
                options: ["A. \\(10-2x>0\\)", "B. \\(10-2x<0\\)", "C. \\(10x-2>0\\)", "D. \\(10x-2<0\\)"],
                correct: 1,
                explanation: "Nhận diện: Đây là dạng cho nghiệm -> Hỏi bất phương trình. <br>Trước tiên xét chiều của các phương trình. Chiều \\(>\\) không thể tạo ra chiều \\(\\ge\\); Chiều \\(<\\) không thể tạo ra chiều \\(\\le\\). Chuyển hết \\(x\\) sang vế trái và thu gọn xem kết quả là số âm hay số dương, nếu dương thì giữ nguyên chiều của nghiệm, nếu âm thì đổi chiều của nghiệm. <br>Trường hợp vẫn chưa chọn được đáp án lúc này mới xét đến giá trị nghiệm, ta bấm giải nghiệm từng BPT nhưng đổi dấu của BPT thành dấu \\(=\\). <br>Đáp án B."
            },
            {
                id: 8,
                q: "Câu hỏi. Khi trừ cả hai vế của bất đẳng thức \\(a>b\\) cho c. Khẳng định nào sau đây đúng?",
                options: ["A. \\(a-c < b-c\\)", "B. \\(a-c > b-c\\)", "C. \\(a-c \\le b-c\\)", "D. \\(a.c \\ge b.c\\)"],
                correct: 1,
                explanation: "BĐT chỉ đổi chiều khi xảy ra một trong hai trường hợp sau:<br>Trường hợp 1: Khi nhân/chia cả hai vế của BĐT với số âm; <br>Trường hợp 2: Khi cả hai vế của BĐT bị chia bởi cùng một số dương. <br>Đáp án B."
            },
            {
                id: 9,
                q: "Câu hỏi. Cho \\(0 < a < b\\). Khẳng định nào sau đây là đúng?",
                options: ["A. \\(\\frac{1}{a} < \\frac{1}{b}\\)", "B. \\(\\frac{1}{a} > \\frac{1}{b}\\)", "C. \\(\\frac{1}{a} \\le \\frac{1}{b}\\)", "D. \\(\\frac{1}{a} = \\frac{1}{b}\\)"],
                correct: 1,
                explanation: "BĐT chỉ đổi chiều khi xảy ra một trong hai trường hợp sau:<br>Trường hợp 1: Khi nhân/chia cả hai vế của BĐT với số âm; <br>Trường hợp 2: Khi cả hai vế của BĐT bị chia bởi cùng một số dương. <br>Đáp án B."
            },
            {
                id: 10,
                q: "Câu hỏi. Cho tam giác ABC vuông tại A. Khẳng định nào sau đây đúng khi phát biểu về \\(\\sin B\\)?",
                options: ["A. \\(\\sin B = \\frac{AC}{AB}\\)", "B. \\(\\sin B = \\frac{AB}{AC}\\)", "C. \\(\\sin B = \\frac{AC}{BC}\\)", "D. \\(\\sin B = \\frac{AB}{BC}\\)"],
                correct: 2,
                explanation: "Trong tam giác vuông, \\(\\sin\\alpha\\) bằng cạnh đối chia cạnh huyền; \\(\\cos\\alpha\\) bằng cạnh kề chia cạnh huyền; \\(\\tan\\alpha\\) bằng cạnh đối chia cạnh kề; \\(\\cot\\alpha\\) bằng cạnh kề chia cạnh đối.<br>Kỹ thuật xác định nhanh cạnh huyền, cạnh đối và cạnh kề:<br>+ Cạnh huyền là tên tam giác nhưng bỏ vuông<br>+ Cạnh đối của góc là tên tam giác nhưng bỏ góc đó<br>+ Cạnh huyền của góc là lấy vuông và lấy góc đó.<br>Đáp án C."
            },
            {
                id: 11,
                q: "Câu hỏi. Cho góc nhọn \\(\\alpha\\) thoả mãn \\(\\tan \\alpha = \\frac{4}{3}\\). Khẳng định nào sau đây đúng?",
                options: ["A. \\(\\sin(90^\\circ - \\alpha) = \\frac{4}{3}\\)", "B. \\(\\cos(90^\\circ - \\alpha) = \\frac{4}{3}\\)", "C. \\(\\tan(90^\\circ - \\alpha) = \\frac{4}{3}\\)", "D. \\(\\cot(90^\\circ - \\alpha) = \\frac{4}{3}\\)"],
                correct: 3,
                explanation: "Ta có tính chất 2 góc phụ nhau: \\(\\sin = \\cos\\) và \\(\\tan = \\cot\\); <br>góc phụ với góc \\(\\alpha\\) là góc \\((90^\\circ - \\alpha)\\). <br>Đáp án D."
            },
            {
                id: 12,
                q: "Câu hỏi. Giá trị của \\(\\cot 31^\\circ 32'\\) khi làm tròn đến chữ số thập phân thứ 2 là?",
                options: ["A. 1,63", "B. 0,61", "C. 0,85", "D. 1,62"],
                correct: 0,
                explanation: "Sử dụng MTCT. Trước tiên đảm bảm máy đang hiện chế độ là 'D'. Bấm \\(\\sin/\\cos/\\tan\\) -> Bấm số đo góc kèm đơn vị -> bấm ) -> bấm \\(^\\circ\\) -> Bấm \\(=\\). <br>Làm tròn đến chữ số thập phân thứ 2 là 1,63. <br>Đáp án A."
            }
        ];

        // Trạng thái theo dõi chung
        let student = { name: "", class: "" };
        let firstStartTime = null; 
        let endTime = null;
        let roundStartedAt = null;
        let roundFinishedAt = null;
        let retryCount = 0; 
        let wrongCounts = {}; 

        // Trạng thái của vòng hiện tại
        let currentQuestions = [];
        let currentIndex = 0;
        let timerInterval;
        let timeLeft = 30;
        let hasAnswered = false;
        let results = { correct: 0, wrong: 0 };

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function getCurrentTime() {
            let now = new Date();
            return now.toLocaleTimeString('vi-VN') + ' - ' + now.toLocaleDateString('vi-VN');
        }

        window.startQuiz = function() {
            student.name = document.getElementById('student-name').value.trim();
            student.class = document.getElementById('student-class').value.trim();
            
            if (!student.name || !student.class) {
                alert("Vui lòng nhập đầy đủ Họ Tên và Lớp!"); 
                return;
            }

            if (!firstStartTime) firstStartTime = getCurrentTime(); 

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('student-info-display').textContent = `${student.name} - ${student.class}`;

            startRound();
        };

        function startRound() {
            clearInterval(timerInterval);
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-stats').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            roundStartedAt = Date.now();
            roundFinishedAt = null;
            currentQuestions = shuffle([...questionsData]);
            currentIndex = 0;
            results = { correct: 0, wrong: 0 };
            loadQuestion();
            window.scrollTo(0, 0);
        }

        function loadQuestion() {
            hasAnswered = false;
            timeLeft = 30;
            
            document.getElementById('timer').textContent = `${timeLeft}s`;
            document.getElementById('question-progress').textContent = `Câu ${currentIndex + 1}/${currentQuestions.length}`;
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-restart-round').classList.add('hidden');
            
            const q = currentQuestions[currentIndex];
            document.getElementById('question-text').innerHTML = q.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // --- BẮT ĐẦU PHẦN TRỘN ĐÁP ÁN ---
            // 1. Tách đáp án khỏi tiền tố A, B, C, D gốc và lưu lại vị trí đúng
            let optionsObj = q.options.map((opt, idx) => ({
                text: opt.replace(/^[A-D]\.\s*/, ''), 
                isCorrect: (idx === q.correct)
            }));

            // 2. Trộn ngẫu nhiên mảng đáp án
            optionsObj = shuffle(optionsObj);

            // 3. Cập nhật lại vị trí đáp án đúng sau khi trộn
            q.currentCorrectIndex = optionsObj.findIndex(o => o.isCorrect);

            // 4. In ra giao diện và gắn lại A, B, C, D theo thứ tự mới
            optionsObj.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 border rounded-lg hover:bg-blue-50 transition duration-200 option-btn text-gray-700 bg-white';
                
                const letter = String.fromCharCode(65 + idx); // Tự động tạo chữ A (65), B (66), C (67), D (68)
                btn.innerHTML = `${letter}. ${opt.text}`;
                
                btn.onclick = () => selectOption(idx, btn, q);
                optionsContainer.appendChild(btn);
            });
            // --- KẾT THÚC PHẦN TRỘN ĐÁP ÁN ---

            if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise().catch(console.error);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeUp(q);
                }
            }, 1000);
        }

        function selectOption(selectedIndex, btnElement, q) {
            if (hasAnswered) return;
            hasAnswered = true;
            if (currentIndex === currentQuestions.length - 1) roundFinishedAt = Date.now();
            clearInterval(timerInterval);
            
            // Kiểm tra tính đúng/sai dựa trên vị trí mới đã trộn
            const isCorrect = selectedIndex === q.currentCorrectIndex;
            
            if (isCorrect) {
                results.correct++;
                btnElement.classList.remove('border-gray-200', 'bg-white', 'hover:bg-blue-50');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600');
                setTimeout(nextQuestion, 500);
            } else {
                results.wrong++;
                wrongCounts[q.id] = (wrongCounts[q.id] || 0) + 1; 
                btnElement.classList.remove('border-gray-200', 'bg-white', 'hover:bg-blue-50');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600');
                showExplanation(q, "Bạn đã chọn sai!");
            }
        }

        function handleTimeUp(q) {
            if (hasAnswered) return;
            hasAnswered = true;
            results.wrong++;
            wrongCounts[q.id] = (wrongCounts[q.id] || 0) + 1; 
            showExplanation(q, "Hết thời gian!");
        }

        function showExplanation(question, title) {
            const btns = document.querySelectorAll('.option-btn');
            // Bôi xanh đáp án đúng dựa theo vị trí mới
            btns[question.currentCorrectIndex].classList.remove('bg-white', 'hover:bg-blue-50');
            btns[question.currentCorrectIndex].classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'font-bold');
            
            const fbContainer = document.getElementById('feedback-container');
            document.getElementById('feedback-title').textContent = title;
            document.getElementById('feedback-explanation').innerHTML = `<strong>Cách giải:</strong> ${question.explanation}`;
            fbContainer.classList.remove('hidden');
            
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-restart-round').classList.remove('hidden');
            if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise().catch(console.error);
        }

        window.restartRoundNow = function() {
            const restartButton = document.getElementById('btn-restart-round');
            if (!hasAnswered || restartButton.classList.contains('hidden')) return;
            restartButton.classList.add('hidden');
            retryCount++;
            startRound();
        };

        window.nextQuestion = function() {
            if (!hasAnswered || currentIndex >= currentQuestions.length) return;
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        };

        function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('result-student').textContent = `${student.name} - ${student.class}`;
            document.getElementById('result-correct').textContent = results.correct;
            document.getElementById('result-wrong').textContent = results.wrong;
            document.getElementById('result-retries').textContent = (retryCount + 1) + " vòng";
            document.getElementById('result-start').textContent = firstStartTime;

            const isPassed = (results.correct === currentQuestions.length);
            document.getElementById('result-stats').classList.toggle('hidden', !isPassed);
            const btnAction = document.getElementById('btn-action');

            if (!isPassed) {
                // CHƯA ĐẠT 12/12
                document.getElementById('result-title').textContent = "Chưa Vượt Ải!";
                document.getElementById('result-title').className = "text-3xl font-bold text-red-600 mb-2";
                document.getElementById('result-message').textContent = `Bạn cần trả lời đúng 12/12 câu để hoàn thành. Hãy làm lại vòng nữa nhé!`;
                document.getElementById('result-end-container').classList.add('hidden');
                
                btnAction.textContent = "Làm lại vòng nữa";
                btnAction.onclick = () => {
                    retryCount++;
                    startRound();
                };
            } else {
                // ĐẠT 12/12
                endTime = getCurrentTime();
                document.getElementById('result-finish').textContent = endTime;
                document.getElementById('result-title').textContent = "Vượt Ải Thành Công!";
                document.getElementById('result-title').className = "text-3xl font-bold text-green-600 mb-2";
                document.getElementById('result-message').textContent = "Tuyệt vời! Kết quả của bạn đã được gửi cho giáo viên.";
                
                document.getElementById('result-end-container').classList.remove('hidden');
                const durationSeconds = Math.max(0, Math.ceil(((roundFinishedAt || Date.now()) - roundStartedAt) / 1000));
                document.getElementById('result-end').textContent = `${Math.floor(durationSeconds / 60)} phút ${durationSeconds % 60} giây`;
                
                btnAction.textContent = "Đóng & Trở về trang chủ";
                btnAction.onclick = () => location.reload();

                // Dịch dữ liệu số lần sai sang dạng chuỗi (Ví dụ: "Câu 2: 1 lần, Câu 5: 3 lần")
                let wrongDetailsStr = Object.keys(wrongCounts).length > 0 
                    ? Object.keys(wrongCounts).map(id => `Câu ${id}: ${wrongCounts[id]} lần`).join(', ')
                    : "Hoàn hảo (Không sai câu nào)";

                // Gửi dữ liệu về Google Sheets
                if (GOOGLE_SCRIPT_URL.includes("script.google.com")) {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            name: student.name,
                            className: student.class,
                            startTime: firstStartTime,
                            endTime: endTime,
                            retries: retryCount,
                            wrongDetails: wrongDetailsStr
                        })
                    }).catch(console.error);
                }
            }
        }
    </script>
</body>
</html>
